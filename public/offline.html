<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3EBDD" />
    <title>GhostSignal — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #F3EBDD; color: #292820; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 30rem); padding: 2rem; border: 1px solid #D8CEBC; border-radius: 1rem; background: #FAF6ED; }
      h1 { margin-top: 0; } p { line-height: 1.6; color: #625D52; }
      a { display: inline-flex; min-height: 2.75rem; align-items: center; padding: 0 1rem; border-radius: .6rem; background: #52634A; color: white; font-weight: 650; }
      @media (prefers-color-scheme: dark) { :root { background: #211F1A; color: #F3EBDD; } main { background: #2D2A23; border-color: #504A3E; } p { color: #C1B9AA; } a { background: #A5B58E; color: #211F1A; } }
    </style>
  </head>
  <body><main><h1>GhostSignal</h1><p>The app could not open while you are offline. Reopen GhostSignal after connecting once so this device can cache its app files.</p><a href="/">Try again</a></main></body>
</html>
